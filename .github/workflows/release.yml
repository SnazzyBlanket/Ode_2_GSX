name: Build release previews
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-arm64
          - os: windows-2022
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 29396c22c93392d6738e021b83196283d6e4d850
          path: deps/JUCE
      - uses: actions/checkout@v4
        with:
          repository: electro-smith/DaisySP
          ref: 2c72eaf9eac5fc0dca1919d65d606da907832618
          path: deps/DaisySP
      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extra=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0)
          fi
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$PWD/deps/JUCE" -DDAISYSP_PATH="$PWD/deps/DaisySP" "${extra[@]}"
      - name: Build
        run: cmake --build build-release --config Release --parallel 3
      - name: Tests
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Package
        run: python scripts/package.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ODE-TO-GSX-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 29396c22c93392d6738e021b83196283d6e4d850
          path: deps/JUCE
      - uses: actions/checkout@v4
        with:
          repository: electro-smith/DaisySP
          ref: 2c72eaf9eac5fc0dca1919d65d606da907832618
          path: deps/DaisySP
      - name: Corresponding source with dependencies
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/ODE-TO-GSX-0.2.0-source-with-dependencies.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum ODE-TO-GSX-0.2.0-source-with-dependencies.tar.gz > ODE-TO-GSX-0.2.0-source-with-dependencies.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ODE-TO-GSX-source
          path: |
            ${{ runner.temp }}/ODE-TO-GSX-0.2.0-source-with-dependencies.tar.gz
            ${{ runner.temp }}/ODE-TO-GSX-0.2.0-source-with-dependencies.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "ODE TO GSX $GITHUB_REF_NAME — preview" --notes-file DISTRIBUTION.txt --prerelease
